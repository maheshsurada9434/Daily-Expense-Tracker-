name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Both values are public by design (Row Level Security protects the data). Override with repository variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://sajrlqjybpsriygphnqb.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_nfiYn2TGhfLd9lv4z8TL-g_gtW7AWmA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: scripts/ci-step.sh install npm install --no-audit --no-fund
      - name: Type check
        run: scripts/ci-step.sh typecheck npm run typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh lint npm run lint
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh unit-tests npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh build npm run build
      - name: End-to-end tests (mocked backend)
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium
          scripts/ci-step.sh e2e bash -c 'npm run e2e || { cat test-results/*/error-context.md; exit 1; }'
      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
